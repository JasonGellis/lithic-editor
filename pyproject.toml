[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithic-editor"
dynamic = ["version"]
description = "Archaeological image processing tool for lithic drawings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jason Jacob Gellis", email = "jg760@cam.ac.uk"},
]
requires-python = ">=3.10"
keywords = [
    "archaeology", "lithic", "image-processing", "computer-vision",
    "archaeological-tools", "stone-tools", "artifact-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    # The contrib build is required: neural upscaling uses cv2.dnn_superres,
    # which the plain opencv-python wheel does not ship.
    "opencv-contrib-python>=4.8",
    "Pillow>=10.0",
    "PyQt5>=5.15.10",
    "scikit-image>=0.22",
    "networkx>=3.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
]
dev = [
    "lithic-editor[test]",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://jasongellis.github.io/lithic-editor/"
Documentation = "https://jasongellis.github.io/lithic-editor/"
Repository = "https://github.com/JasonGellis/lithic-editor"
Issues = "https://github.com/JasonGellis/lithic-editor/issues"

[project.scripts]
lithic-editor = "lithic_editor.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "lithic_editor.__version__"}

[tool.setuptools.packages.find]
include = ["lithic_editor*"]

[tool.setuptools.package-data]
lithic_editor = ["models/*.pb", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
qt_api = "pyqt5"
filterwarnings = [
    "ignore:.*sipPyTypeDict.*is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["site", "docs", "paper", "example_images", "image_debug", "output"]

[tool.ruff.lint]
# Pyflakes plus the pycodestyle error classes: real defects, not style.
select = ["E4", "E7", "E9", "F"]
# E712: tests compare Qt and numpy values with `== True`, which is not the same as `is True`.
# F841: unused locals are a cleanup item, not a defect; re-enable once they are removed.
ignore = ["E712", "F841"]
